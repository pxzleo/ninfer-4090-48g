services:
  ninfer:
    build:
      context: .
    image: ninfer-4090:sm89
    container_name: ninfer-4090
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/workspace/models:ro
    command:
      - ninfer-serve
      - models/qwen3_8_27b.ninfer
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --max-context
      - "262144"
      - --kv-capacity
      - "524288"
      - --max-concurrency
      - "8"
      - --max-pending-requests
      - "16"
      - --pending-timeout-ms
      - "600000"
      - --prefill-chunk
      - "1024"
      - --kv-dtype
      - int8
      - --spec
      - mtp
      - --draft-tokens
      - "3"
      - --lm-head-draft
      - --vision
      - --preserve-thinking
      - --log-stats-interval-ms
      - "2000"
